name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Build
        run: dotnet build PhoneBook.slnx --configuration Release

      - name: Test
        run: dotnet test PhoneBook.slnx --configuration Release --no-build
